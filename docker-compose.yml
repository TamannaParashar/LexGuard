services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lexguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lexguard-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
